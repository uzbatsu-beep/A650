name: Bench discovery checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,gui,serial]"
      - name: Compile-check source
        run: python -m compileall -q src/a650 tests
      - name: Full test suite (no hardware access)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
