name: Windows interface preview

on:
  push:
    branches:
      - codex/a650-interface-preview
    tags:
      - preview-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev,build]"
      - name: Verify release identity
        id: identity
        shell: pwsh
        run: |
          $previewVersion = python -c "from a650 import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "preview-$previewVersion") {
            throw "Release tag does not match application version $previewVersion"
          }
          "version=$previewVersion" >> $env:GITHUB_OUTPUT
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
      - name: Build executable
        run: pyinstaller packaging/a650.spec --distpath dist --workpath build --noconfirm
      - name: Verify executable and GUI startup
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          & dist/a650.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/a650.exe --simulate read 0x3000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/a650.exe diagnostics --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath dist/a650.exe -ArgumentList '--simulate','gui','--auto-quit','4000' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'GUI startup timed out' }
          if ($process.ExitCode -ne 0) { throw "GUI exited with code $($process.ExitCode)" }
      - name: Package Windows preview
        shell: pwsh
        run: python packaging/package_preview.py --binary dist/a650.exe --commit "$env:GITHUB_SHA" --source-ref "$env:GITHUB_REF_NAME"
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: a650-windows-interface-preview-${{ steps.identity.outputs.version }}
          path: |
            dist/preview-release/*.zip
            dist/preview-release/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/preview-')
        uses: softprops/action-gh-release@v2
        with:
          name: "ONI A650 ${{ steps.identity.outputs.version }} — промежуточная сборка"
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/preview-release/*.zip
            dist/preview-release/*.sha256
          body_path: docs/releases/${{ steps.identity.outputs.version }}.md
